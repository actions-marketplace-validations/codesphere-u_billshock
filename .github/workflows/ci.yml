name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-audit:
    name: Lint, Typecheck & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" pip-audit

      - name: Ruff lint
        run: ruff check .

      - name: Mypy strict typecheck
        run: mypy

      - name: Dependency audit
        run: pip-audit --skip-editable

  test:
    name: Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest -v

      - name: Verify console entrypoint
        run: billshock --version

      - name: Dogfood clean fixture & repo self-audit
        run: |
          python3 skills/billshock/scripts/billshock.py . --fail-on any --min-score 100 --no-color
          python3 skills/billshock/scripts/billshock.py tests/fixtures/clean_app --fail-on any --min-score 100 --no-color

      - name: Verify runaway fixture fails CI gate
        run: |
          set +e
          python3 skills/billshock/scripts/billshock.py tests/fixtures/runaway_app --fail-on high --no-color
          STATUS=$?
          set -e
          test "$STATUS" -eq 1

  action-dogfood:
    name: Composite Action End-to-End Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run local BillShock composite action on clean fixture
        id: clean
        uses: ./
        with:
          path: tests/fixtures/clean_app
          fail-on: any
          min-score: "100"
          sarif-file: /tmp/clean.sarif

      - name: Validate action outputs and SARIF file
        run: |
          test "${{ steps.clean.outputs.score }}" = "100"
          test "${{ steps.clean.outputs.grade }}" = "SAFE"
          test "${{ steps.clean.outputs.critical-count }}" = "0"
          test -s /tmp/clean.sarif

      - name: Run local action with default runner-temp SARIF
        id: clean_default
        uses: ./
        with:
          path: tests/fixtures/clean_app
          fail-on: any

      - name: Verify default SARIF created without polluting workspace
        run: |
          test -s "${{ steps.clean_default.outputs.sarif-file }}"
          test -z "$(git status --porcelain)"

  docker:
    name: Docker Build & Non-Root Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t billshock:ci .

      - name: Verify non-root execution and self-audit
        run: |
          UID_OUT="$(docker run --rm --entrypoint id billshock:ci -u)"
          test "$UID_OUT" -ne 0
          docker run --rm billshock:ci --version
          docker run --rm -v "$PWD:/workspace:ro" billshock:ci . --fail-on any --min-score 100 --no-color
